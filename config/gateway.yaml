gateway:
  host: 0.0.0.0
  request_timeout_ms: 120000
  ports:
    - port: 4105
      app_name: codex-cli
      description: Codex CLI dedicated port
      auth:
        require_bearer: true
      routing_strategy: latency-first
    - port: 4106
      app_name: app-a
      description: Example app port for cost-sensitive traffic
      auth:
        require_bearer: false
      routing_strategy: cost-first
    - port: 4107
      app_name: app-b
      description: Example app port for balanced routing
      auth:
        require_bearer: false
      routing_strategy: balanced
    - port: 4000
      app_name: default
      description: Default OpenAI-compatible gateway port
      auth:
        require_bearer: false
      routing_strategy: balanced

upstreams:
  # Primary provider with native Responses API support.
  - id: primary-openai-compatible
    name: Primary OpenAI-Compatible Provider
    origin: https://primary.example.com
    responses_full_path: /v1/responses
    chat_full_path: /v1/chat/completions
    api_key: os.environ/UPSTREAM_PRIMARY_API_KEY
    priority: 1
    timeout_ms: 120000
    supported_models:
      - codex-model
      - general-model
    model_aliases:
      codex: codex-model
      gpt: general-model
    capabilities:
      supports_responses: true
      supports_chat_completions: true
      responses_requires_stream: false
      responses_always_streams: false
      chat_requires_stream: false
      chat_always_streams: false
      responses_event_format: standard
      chat_event_format: openai
    cost:
      per_1k_prompt: 0.01
      per_1k_completion: 0.03

  # Backup provider that only supports Chat Completions. LLM-Hub can transform
  # Responses API traffic when failover requires this route.
  - id: backup-openai-compatible
    name: Backup OpenAI-Compatible Provider
    origin: https://backup.example.com
    chat_full_path: /v1/chat/completions
    api_key: os.environ/UPSTREAM_BACKUP_API_KEY
    priority: 2
    timeout_ms: 120000
    supported_models:
      - codex-model
      - general-model
    model_aliases:
      codex: codex-model
      gpt: general-model
    capabilities:
      supports_responses: false
      supports_chat_completions: true
      chat_requires_stream: false
      chat_always_streams: false
      chat_event_format: openai
    cost:
      per_1k_prompt: 0.01
      per_1k_completion: 0.03

  # Optional third route for Claude-compatible model names exposed through an
  # OpenAI-compatible Chat Completions endpoint.
  - id: optional-claude-compatible
    name: Optional Claude-Compatible Provider
    origin: https://claude-compatible.example.com
    chat_full_path: /v1/chat/completions
    api_key: os.environ/UPSTREAM_CLAUDE_API_KEY
    priority: 3
    timeout_ms: 120000
    supported_models:
      - claude-model
    model_aliases:
      claude: claude-model
      opus: claude-model
      sonnet: claude-model
    capabilities:
      supports_responses: false
      supports_chat_completions: true
      chat_requires_stream: false
      chat_always_streams: false
      chat_event_format: openai
    cost:
      per_1k_prompt: 0.01
      per_1k_completion: 0.03

failover:
  routing_mode: dynamic
  include_cooling_upstreams: false
  passive_monitoring: true
  circuit_breaker:
    failure_threshold: 3
    initial_cooldown: 60
    max_cooldown: 1800
    exponential_backoff: true
  routing_strategy:
    codex-cli: latency-first
    app-a: cost-first
    app-b: balanced
    default: balanced

database:
  type: sqlite
  path: ./data/llmhub.db

monitoring:
  enabled: true
  dashboard_host: 0.0.0.0
  dashboard_port: 8080
  notifications:
    enabled: false
    critical_only: true
    openclaw:
      gatewayUrl: ${OPENCLAW_GATEWAY_URL}
      gatewayToken: ${OPENCLAW_GATEWAY_TOKEN}
      agentId: ${NOTIFY_AGENT_ID}
      userId: ${NOTIFY_USER_ID}
