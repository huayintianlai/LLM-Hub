gateway:
  host: 0.0.0.0
  request_timeout_ms: 120000
  ports:
    - port: 4105
      app_name: codex-cli
      description: Codex CLI dedicated port
      auth:
        require_bearer: true
      routing_strategy: latency-first
    - port: 4106
      app_name: kekebaby
      description: KekeBaby dedicated port
      auth:
        require_bearer: false
      routing_strategy: cost-first
    - port: 4107
      app_name: claude-code
      description: Claude Code dedicated port
      auth:
        require_bearer: false
      routing_strategy: balanced
    - port: 4000
      app_name: default
      description: Default gateway port
      auth:
        require_bearer: false
      routing_strategy: balanced

upstreams:
  # quan2go：原生支持 /responses API
  # 可用模型：gpt-5.4, gpt-5.3-codex
  # 可容灾模型：gpt-5.4, gpt-5.3-codex（quan2go + yunyi 都支持）
  # 下游可使用别名：gpt → gpt-5.4, codex → gpt-5.3-codex
  - id: quan2go-gpt
    name: Quan2go GPT
    origin: https://capi.quan2go.com
    responses_full_path: /openai/responses
    chat_full_path: /v1/chat/completions
    api_key: os.environ/GPT_KEY_B
    priority: 1
    timeout_ms: 120000
    supported_models:
      - gpt-5.4
      - gpt-5.3-codex
    model_aliases:
      gpt-5-codex: gpt-5.3-codex
      codex: gpt-5.3-codex
      gpt: gpt-5.4
    capabilities:
      supports_responses: true
      supports_chat_completions: true
      responses_requires_stream: true
      responses_always_streams: true
      chat_requires_stream: false
      chat_always_streams: true
      responses_event_format: standard
      chat_event_format: openai
    cost:
      per_1k_prompt: 0.008
      per_1k_completion: 0.024

  # yunyi：不支持 /responses，需要转换
  # 可用模型：gpt-5.4, gpt-5.3, gpt-5.3-codex, gpt-5.2, gpt-5.2-codex, gpt-5.1-codex, gpt-5.1-codex-max, gpt-5.1-codex-mini, gpt-5.1, gpt-5-codex
  # 可容灾模型：gpt-5.4, gpt-5.3-codex（quan2go + yunyi 都支持）
  # 仅 yunyi 可用（无容灾）：gpt-5.3, gpt-5.2, gpt-5.2-codex, gpt-5.1-codex-max, gpt-5.1-codex, gpt-5.1-codex-mini, gpt-5.1, gpt-5-codex
  # 下游可使用别名：gpt → gpt-5.4, codex → gpt-5.3-codex
  - id: yunyi-gpt
    name: Yunyi GPT
    origin: https://yunyi.cfd
    chat_full_path: /codex/v1/chat/completions
    api_key: os.environ/GPT_KEY_A
    priority: 2
    timeout_ms: 120000
    supported_models:
      - gpt-5.4
      - gpt-5.3
      - gpt-5.3-codex
      - gpt-5.2
      - gpt-5.2-codex
      - gpt-5.1-codex-max
      - gpt-5.1-codex
      - gpt-5.1-codex-mini
      - gpt-5.1
      - gpt-5-codex
    model_aliases:
      gpt-5-codex: gpt-5.3-codex
      codex: gpt-5.3-codex
      gpt: gpt-5.4
    capabilities:
      supports_responses: false
      supports_chat_completions: true
      chat_requires_stream: false
      chat_always_streams: false
      chat_event_format: openai
    cost:
      per_1k_prompt: 0.01
      per_1k_completion: 0.03

  # yunyi claude 渠道
  # 可用模型：claude-opus-4-6, claude-sonnet-4-6, claude-haiku-4-5-20251001（及其他版本）
  # 可容灾模型：无（仅 yunyi-claude 一个上游）
  # 下游可使用别名：claude → claude-opus-4-6, opus → claude-opus-4-6, sonnet → claude-sonnet-4-6, haiku → claude-haiku-4-5-20251001
  - id: yunyi-claude
    name: Yunyi Claude
    origin: https://yunyi.rdzhvip.com
    chat_full_path: /claude/v1/chat/completions
    api_key: os.environ/CLAUDE_KEY_A
    priority: 1
    timeout_ms: 120000
    supported_models:
      - claude-opus-4-6
      - claude-opus-4-5-20251101
      - claude-opus-4-1-20250805
      - claude-opus-4-20250514
      - claude-sonnet-4-6
      - claude-sonnet-4-5-20250929
      - claude-sonnet-4-20250514
      - claude-haiku-4-5-20251001
    model_aliases:
      claude: claude-opus-4-6
      opus: claude-opus-4-6
      sonnet: claude-sonnet-4-6
      haiku: claude-haiku-4-5-20251001
    capabilities:
      supports_responses: false
      supports_chat_completions: true
      chat_requires_stream: false
      chat_always_streams: false
      chat_event_format: openai
    cost:
      per_1k_prompt: 0.01
      per_1k_completion: 0.03

failover:
  routing_mode: dynamic
  include_cooling_upstreams: false
  passive_monitoring: true
  circuit_breaker:
    failure_threshold: 3
    initial_cooldown: 60
    max_cooldown: 1800
    exponential_backoff: true
  routing_strategy:
    codex-cli: latency-first
    kekebaby: cost-first
    claude-code: balanced
    default: balanced

database:
  type: sqlite
  path: ./data/llmhub.db

monitoring:
  enabled: true
  dashboard_host: 0.0.0.0
  dashboard_port: 8080
  notifications:
    enabled: true
    critical_only: true
    openclaw:
      gatewayUrl: ${OPENCLAW_GATEWAY_URL}
      gatewayToken: ${OPENCLAW_GATEWAY_TOKEN}
      agentId: ${NOTIFY_AGENT_ID}
      userId: ${NOTIFY_USER_ID}
