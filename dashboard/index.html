<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Hub 仪表板</title>
  <style>
    :root {
      --bg-start: #0f172a;
      --bg-end: #1e293b;
      --accent: #38bdf8;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(148, 163, 184, 0.3);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 45%),
        linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: 0.02em;
    }
    header time {
      color: var(--muted);
      font-size: 0.95rem;
    }
    main {
      flex: 1;
      padding: 1.5rem;
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(2, 6, 23, 0.4);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent);
    }
    .card pre {
      background: rgba(226, 232, 240, 0.05);
      padding: 1rem;
      border-radius: 0.75rem;
      overflow: auto;
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .list {
      flex: 1;
      display: grid;
      gap: 0.75rem;
    }
    .item {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.5);
    }
    .item span {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .item strong {
      color: #f8fafc;
      font-size: 0.95rem;
      word-break: break-word;
    }
    button {
      border: none;
      background: var(--accent);
      color: #0f172a;
      border-radius: 999px;
      padding: 0.65rem 1.25rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: transform 0.2s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .lang-switch {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .lang-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .lang-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tag {
      padding: 0.2rem 0.8rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
    @media (max-width: 600px) {
      body {
        padding-bottom: 1rem;
      }
      header {
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
      }
      .item {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LLM Hub</h1>
      <div class="muted" data-i18n="subtitle">统一网关仪表板</div>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">English</button>
      </div>
      <time id="current-time"></time>
    </div>
  </header>
  <main>
    <section class="card" id="summary-card">
      <div class="meta">
        <h2 data-i18n="summary">概览</h2>
        <span class="tag">/api/summary</span>
      </div>
      <div class="list" id="summary-list">
        <div class="item">
          <span data-i18n="total_requests">总请求数</span>
          <strong>—</strong>
        </div>
        <div class="item">
          <span data-i18n="successful">成功请求</span>
          <strong>—</strong>
        </div>
        <div class="item">
          <span data-i18n="average_latency">平均延迟 (毫秒)</span>
          <strong>—</strong>
        </div>
        <div class="item">
          <span data-i18n="total_cost">总成本 (美元)</span>
          <strong>—</strong>
        </div>
      </div>
      <button id="refresh-summary" data-i18n="refresh">刷新</button>
    </section>

    <section class="card" id="requests-card">
      <div class="meta">
        <h2 data-i18n="recent_requests">最近请求</h2>
        <span class="tag">/api/requests</span>
      </div>
      <div class="list" id="requests-list">
        <div class="item">
          <span data-i18n="loading">加载中...</span>
          <strong></strong>
        </div>
      </div>
    </section>

    <section class="card" id="upstreams-card">
      <div class="meta">
        <h2 data-i18n="upstreams">上游服务</h2>
        <span class="tag">/api/upstreams</span>
      </div>
      <div class="list" id="upstreams-list"></div>
    </section>

    <section class="card" id="config-card">
      <div class="meta">
        <h2 data-i18n="gateway_config">网关配置</h2>
        <span class="tag">/api/config</span>
      </div>
      <pre id="config-block" data-i18n="loading_config">加载配置中…</pre>
    </section>
  </main>
  <script>
    const translations = {
      zh: {
        subtitle: '统一网关仪表板',
        summary: '概览',
        total_requests: '总请求数',
        successful: '成功请求',
        average_latency: '平均延迟 (毫秒)',
        total_cost: '总成本 (美元)',
        refresh: '刷新',
        recent_requests: '最近请求',
        loading: '加载中...',
        upstreams: '上游服务',
        gateway_config: '网关配置',
        loading_config: '加载配置中…',
        no_recent_requests: '暂无最近请求',
        no_upstreams: '未配置上游服务',
        app: '应用',
        port: '端口',
        upstream: '上游',
        tokens: 'tokens',
        cooldown: '冷却时间',
        ready: '就绪',
        failures: '失败次数'
      },
      en: {
        subtitle: 'Unified Gateway dashboard',
        summary: 'Summary',
        total_requests: 'Total requests',
        successful: 'Successful requests',
        average_latency: 'Average latency (ms)',
        total_cost: 'Total cost (USD)',
        refresh: 'Refresh',
        recent_requests: 'Recent requests',
        loading: 'Loading...',
        upstreams: 'Upstreams',
        gateway_config: 'Gateway config',
        loading_config: 'Loading configuration…',
        no_recent_requests: 'No recent requests',
        no_upstreams: 'No upstreams configured',
        app: 'App',
        port: 'port',
        upstream: 'Upstream',
        tokens: 'tokens',
        cooldown: 'Cooldown',
        ready: 'ready',
        failures: 'Failures'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'zh';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

      // Update all elements with data-i18n
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });

      // Update language buttons
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });

      // Refresh data to update dynamic content
      refreshAll();
    }

    // Language switcher
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        setLanguage(btn.getAttribute('data-lang'));
      });
    });

    const endpoints = {
      summary: '/api/summary',
      requests: '/api/requests',
      upstreams: '/api/upstreams',
      config: '/api/config'
    };

    const timeEl = document.getElementById('current-time');

    function updateTime() {
      timeEl.textContent = new Date().toLocaleString();
    }

    async function fetchJson(path) {
      const resp = await fetch(path);
      if (!resp.ok) {
        throw new Error(`${path} -> ${resp.status}`);
      }
      return resp.json();
    }

    function renderSummary(summary = {}) {
      const list = document.getElementById('summary-list');
      const t = translations[currentLang];
      const items = [
        { label: t.total_requests, value: summary.total_requests },
        { label: t.successful, value: summary.successful_requests },
        { label: t.average_latency, value: summary.average_latency_ms },
        { label: t.total_cost, value: summary.total_cost_usd?.toFixed ? summary.total_cost_usd.toFixed(6) : summary.total_cost_usd }
      ];
      list.innerHTML = '';
      items.forEach((entry) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<span>${entry.label}</span><strong>${entry.value ?? '—'}</strong>`;
        list.appendChild(div);
      });
    }

    function renderRequests(data = []) {
      const list = document.getElementById('requests-list');
      const t = translations[currentLang];
      list.innerHTML = '';
      if (!data.length) {
        list.innerHTML = `<div class="item"><span>${t.no_recent_requests}</span></div>`;
        return;
      }
      data.slice(0, 5).forEach((entry) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <span>${t.app}: ${entry.app_name} (${t.port} ${entry.app_port})</span>
          <strong>${entry.success ? '✅' : '❌'} ${entry.status_code ?? '—'} ${entry.request_protocol}</strong>
          <span>${t.upstream}: ${entry.upstream_id || 'none'}</span>
          <strong>${entry.tokens_total ?? 0} ${t.tokens} · ${entry.latency_ms ?? '—'}ms</strong>
        `;
        list.appendChild(div);
      });
    }

    function renderUpstreams(snapshot = []) {
      const list = document.getElementById('upstreams-list');
      const t = translations[currentLang];
      list.innerHTML = '';
      snapshot.forEach((upstream) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <span>${upstream.name} (${upstream.id})</span>
          <strong>${upstream.circuit_state}</strong>
          <span>${t.cooldown}: ${upstream.cooldown_until ? new Date(upstream.cooldown_until).toLocaleTimeString() : t.ready}</span>
          <strong>${t.failures}: ${upstream.consecutive_failures}</strong>
        `;
        list.appendChild(div);
      });
      if (!snapshot.length) {
        list.innerHTML = `<div class="item"><span>${t.no_upstreams}</span></div>`;
      }
    }

    function renderConfig(config) {
      const el = document.getElementById('config-block');
      el.textContent = JSON.stringify(config, null, 2);
    }

    async function refreshAll() {
      try {
        const [summary, requests, upstreams, config] = await Promise.all([
          fetchJson(endpoints.summary),
          fetchJson(endpoints.requests),
          fetchJson(endpoints.upstreams),
          fetchJson(endpoints.config)
        ]);
        renderSummary(summary);
        renderRequests(requests);
        renderUpstreams(upstreams.memory || []);
        renderConfig(config);
      } catch (error) {
        console.error('dashboard refresh failed', error);
      }
    }

    document.getElementById('refresh-summary').addEventListener('click', refreshAll);

    // Initialize language on page load
    setLanguage(currentLang);
    updateTime();
    setInterval(() => {
      updateTime();
      refreshAll();
    }, 15000);
  </script>
</body>
</html>
