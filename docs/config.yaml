model_list:
  - model_name: general
    litellm_params:
      model: openai/your-general-model
      api_base: https://primary.example.com/v1
      api_key: os.environ/UPSTREAM_PRIMARY_API_KEY
      timeout: 60
      max_retries: 0
      stream: true
    model_info:
      id: primary-general

  - model_name: codex
    litellm_params:
      model: openai/your-codex-model
      api_base: https://backup.example.com/v1
      api_key: os.environ/UPSTREAM_BACKUP_API_KEY
      timeout: 60
      max_retries: 0
      stream: true
    model_info:
      id: backup-codex

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  allowed_fails: 3
  cooldown_time: 60
  fallbacks:
    - general: ["general"]
    - codex: ["codex"]

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true

general_settings:
  master_key: os.environ/LLMHUB_TEST_BEARER_TOKEN
