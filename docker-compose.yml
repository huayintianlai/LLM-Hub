services:
  gateway:
    build: .
    container_name: llm-hub-gateway
    env_file:
      - .env
    ports:
      - "4000:4000"
      - "4105:4105"
      - "4106:4106"
      - "4107:4107"
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./run:/app/run
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - llm-hub-network

networks:
  llm-hub-network:
    driver: bridge
